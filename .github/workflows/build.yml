# For now
name: build

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os:
        - macos-latest
        - ubuntu-latest
        - windows-latest
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '>=24'
        cache: npm

    - run: npm ci
    - run: npm run check
    - run: npm run test:coverage
    - run: npm run build

    - name: Install browser for interaction tests
      if: matrix.os == 'ubuntu-latest'
      run: npx playwright install --with-deps chromium

    - name: Test browser interactions
      if: matrix.os == 'ubuntu-latest'
      run: npm run test:e2e -- --workers=2

    - name: Deploy to github pages
      uses: crazy-max/ghaction-github-pages@v5.0.0
      with:
        build_dir: dist
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONALACCESSTOKEN }}
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.os == 'ubuntu-latest'

    - uses: codecov/codecov-action@v4.6.0
      if: "!contains(github.event.head_commit.message, 'skip test')"
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  dependabot:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'}}
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --auto "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
